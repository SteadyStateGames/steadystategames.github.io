<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#697c60">
  <meta name="description" content="Pomodoro: a scenic Pomodoro timer with custom timers and a saved checklist.">
  <title>Pomodoro · Pomodoro Timer</title>
  <link rel="icon" href="icon.png" type="image/png">
  <style>
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#eef0e5; color:#293a35; font-family:system-ui,sans-serif; }
    #canvas { display:block; width:100%; height:100%; outline:0; touch-action:none; }
    #loading { position:fixed; inset:0; display:flex; flex-direction:column; gap:18px; align-items:center; justify-content:center; background:#eef0e5; }
    #loading img { width:64px; height:64px; }
    #loading p { font-size:15px; margin:0; max-width:360px; padding:0 24px; text-align:center; }
    progress { width:180px; height:5px; accent-color:#697c60; }
    [hidden] { display:none !important; }
  </style>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="Pomodoro Pomodoro timer"></canvas>
  <div id="loading" role="status">
    <img src="icon.png" alt="">
    <p id="status">Loading Pomodoro…</p>
    <progress id="progress" max="1"></progress>
  </div>
  <script src="browser.js"></script>
  <script src="index.js"></script>
  <script>
    const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":8748888,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
    window.stillEngine = engine;
    engine.startGame({
      canvas: document.getElementById('canvas'),
      onProgress(current,total) {
        if (total > 0) document.getElementById('progress').value = current / total;
      },
    }).then(() => {
      document.getElementById('loading').hidden = true;
      document.getElementById('canvas').focus();
    }).catch(error => {
      console.error(error);
      document.getElementById('progress').hidden = true;
      document.getElementById('status').textContent = 'Could not start Pomodoro. Try reloading in a browser with WebGL 2 support.';
    });
  </script>
</body>
</html>
